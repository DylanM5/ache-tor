services:
  ache:
    image: vidanyu/ache
    command: startCrawl -c /config/ -s /config/tor.seeds -o /data -e tor
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      - JAVA_OPTS=-Xms${MIN_RAM}g -Xmx${MAX_RAM}g
    volumes:
      # mounts /config and /data directories to paths relative to path where this file is located
      - ./data-ache/:/data
      - ./:/config
    depends_on:
      torproxy1:
        condition: service_healthy
      torproxy2:
        condition: service_healthy
      elasticsearch:
        condition: service_started
  # Main DB
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    env_file:
      - ./.env
    environment:
      - discovery.type=single-node
      - cluster.name=${CLUSTER_NAME}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - ES_JAVA_OPTS=-Xms${MIN_RAM}g -Xmx${MAX_RAM}g # Heap size
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic_volume:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT}:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    env_file:
      - ./.env
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    ports:
      - ${KIBANA_PORT}:5601
    depends_on:
      elasticsearch:
        condition: service_healthy

      
  torproxy:
    image: dperson/torproxy
        - torproxy1
        - torproxy2
    healthcheck:
      test: [ "CMD-SHELL", "curl -x socks5h://localhost:9050 -s https://check.torproject.org/api/ip | grep -q '\"IsTor\":true' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    environment:
      - TOR_MaxCircuitDirtiness=300 # new circuit created 5 mins after circuit is dirtied
    ports:
      - "8118:8118"

  haproxy:
    image: haproxy:latest
    ports:
      - "8888:8888"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - torproxy1
      - torproxy2

volumes:
  elastic_volume: